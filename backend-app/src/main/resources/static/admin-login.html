<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusGo | Admin Login</title>
    <link rel="stylesheet" href="styles.css?v=20260509_07" />
  </head>
  <body data-page="admin-login">
    <header class="topbar">
      <div class="topbar-left">
        <button type="button" class="back-btn" onclick="window.history.back()" aria-label="Go back">&#8592;</button>
        <a class="brand" href="index.html">BusGo</a>
        <nav class="crumbs">Admin Login</nav>
      </div>
      <div id="authNav" class="auth-nav"></div>
    </header>

    <main class="page">
      <section class="panel auth-panel reveal">
        <h1>Admin Login</h1>
        <p class="subtle">Access trip and booking management dashboard.</p>
        <form id="adminLoginForm" class="auth-form">
          <label><span>Email</span><input id="adminLoginEmail" type="email" autocomplete="email" required /></label>
          <label><span>Password</span><input id="adminLoginPassword" type="password" autocomplete="current-password" required /></label>
          <button type="submit" class="btn btn-primary">Login as Admin</button>
        </form>
        <div class="forgot-box">
          <button type="button" id="adminForgotToggle" class="btn ghost forgot-toggle">Forgot My Password</button>
          <div id="adminForgotModal" class="forgot-modal" hidden>
            <div class="forgot-modal-card" role="dialog" aria-modal="true" aria-labelledby="adminForgotTitle">
              <div class="forgot-modal-head">
                <div>
                  <h2 id="adminForgotTitle">Reset Password</h2>
                  <p class="subtle small">Enter your admin email address. If an account exists, password reset instructions will be sent to you.</p>
                </div>
                <button type="button" class="forgot-close-btn" data-forgot-close aria-label="Close">&times;</button>
              </div>
              <form id="adminForgotForm" class="forgot-form">
                <label><span>Email Address</span><input id="adminForgotEmail" type="email" autocomplete="email" required /></label>
                <div class="forgot-actions">
                  <button type="submit" class="btn btn-primary">Send</button>
                  <button type="button" class="btn ghost" data-forgot-close>Cancel</button>
                </div>
              </form>
              <div id="adminForgotResult" class="forgot-result subtle" hidden></div>
            </div>
          </div>
        </div>
        <p class="subtle small" style="margin: 14px 0 0;">Default admin: admin@busgo.com / 1234</p>
      </section>
    </main>

    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>
    <script src="script.js?v=20260512_reset_lock"></script>
  </body>
</html>
